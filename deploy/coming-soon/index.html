<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoVoyza · Visa services, coming soon</title>
    <meta name="description" content="GoVoyza is a visa services platform for travellers and travel agencies. We are getting ready to launch.">
    <meta name="theme-color" content="#D4AF37">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23D4AF37'/%3E%3Cpath d='M4 15l16-6-6 11-2-5z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        /* Same brand tokens as public/css/govoyza.css; this page is static, outside the app. */
        :root {
            --gv-gold: #D4AF37; --gv-gold-deep: #B8962B; --gv-gold-soft: #FBF6E6;
            --gv-ink: #222222; --gv-ink-2: #666666; --gv-bg: #FFFFFF; --gv-line: #ECECEC;
            --gv-font: 'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; }
        html, body { height: 100%; }
        body {
            font-family: var(--gv-font); color: var(--gv-ink); background: var(--gv-bg);
            background-image: radial-gradient(60rem 30rem at 50% -10%, var(--gv-gold-soft), transparent 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 32px 16px; text-align: center; -webkit-font-smoothing: antialiased;
        }
        .logo { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .18em; font-size: 20px; }
        .logo b { color: var(--gv-gold); font-weight: 800; }
        .mark {
            width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(145deg, #E6C65C, var(--gv-gold) 55%, var(--gv-gold-deep));
            box-shadow: 0 6px 16px rgba(212, 175, 55, .35);
        }
        .mark svg { width: 22px; height: 22px; }
        main { max-width: 560px; margin-top: 48px; }
        .pill {
            display: inline-block; padding: 6px 14px; border-radius: 999px; border: 1px solid #EADBA8;
            background: var(--gv-gold-soft); color: var(--gv-gold-deep);
            font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
        }
        h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; line-height: 1.12; margin: 20px 0 16px; letter-spacing: -.01em; }
        h1 em { font-style: normal; color: var(--gv-gold-deep); }
        p { color: var(--gv-ink-2); font-size: 17px; line-height: 1.6; }
        footer { margin-top: 64px; font-size: 13px; color: var(--gv-ink-2); border-top: 1px solid var(--gv-line); padding-top: 18px; }
        @media (prefers-color-scheme: dark) {
            :root { --gv-ink: #F2F2F2; --gv-ink-2: #B5B5B5; --gv-bg: #141414; --gv-line: #2A2A2A; --gv-gold-soft: #2A2416; }
            .pill { border-color: #4A3F1E; color: var(--gv-gold); }
            h1 em { color: var(--gv-gold); }
        }
    </style>
</head>
<body>
    <div class="logo" aria-label="GoVoyza">
        <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16l20-8-8 14-2.5-6.5L2 16z"/></svg>
        </span>
        <span>GO<b>VOY</b>ZA</span>
    </div>
    <main>
        <span class="pill">Coming soon</span>
        <h1>Visa services, <em>made simple.</em></h1>
        <p>Find the right visa, see the price and what you need up front, apply online and track every step. We're getting ready to launch.</p>
    </main>
    <footer>&copy; 2026 GoVoyza</footer>
</body>
</html>
